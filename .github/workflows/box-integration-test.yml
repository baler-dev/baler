name: "Box Integration Test"
description: "To test if the modules installed by `{baler}` can be attached by `{box}` R package"

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

jobs:
    box-integration:
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]

        steps:
            - uses: actions/checkout@v4

            - name: "Install rust toolchain"
              run: |
                  rustup toolchain install
                  rustup show

            - name: "Build baler"
              run: cargo build --release --locked -p baler-cli

            - name: "Set up R"
              uses: r-lib/actions/setup-r@v2
              with:
                  r-version: "4.5.3"
                  use-public-rspm: true

            - name: "Install the patched {box} fork"
              run: |
                  Rscript -e 'install.packages("pak")'
                  Rscript -e 'pak::pak("joshuamarie/box@feature/baler-support")'

            - name: "Install modules from examples/modules via baler"
              shell: bash
              run: |
                  if [ "${{ runner.os }}" = "Windows" ]; then
                      ./target/release/baler.exe install examples/modules/convert-proj --install-deps
                      ./target/release/baler.exe install examples/modules/rcalc --install-deps
                  else
                      ./target/release/baler install examples/modules/convert-proj --install-deps
                      ./target/release/baler install examples/modules/rcalc --install-deps
                  fi

            - name: "Verify box::use() resolves the installed module"
              run: Rscript scripts/verify-box-use.R
